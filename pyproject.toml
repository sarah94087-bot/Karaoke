[project]
name = "karaoke"
version = "0.1.0"
description = "Hebrew karaoke player — stem separation, real-time key/tempo, timed lyrics"
requires-python = ">=3.11"

# Declared, not installed from here: the venv on this machine was built by hand
# during phase 0, and the GPU/research stack (torch, demucs) has no business in
# the API image. The `api` group is what the T-1.3 Dockerfile installs.
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # The async driver. Chapter 10 runs migrations as a separate deploy step
    # from the same image, so alembic ships in the runtime group, not in dev.
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",  # multipart/form-data, i.e. file upload
    # The client for the deployed GPU function (T-0.3). Small; the model and
    # the torch stack live on the remote side, not here.
    "modal>=1.5",
    # T-3.7, and the one place this project does *not* hand-roll a signature.
    # Every other one here is HMAC - one hash, and getting it wrong shows up as
    # "the service refuses everything". Supabase signs its tokens with ES256,
    # elliptic-curve, where a subtly wrong verifier accepts forgeries instead
    # and says nothing. That is not a thing to write yourself.
    "pyjwt[crypto]>=2.9",
]
# Local CPU separation (chapter 10's local environment, and chapter 11's escape
# route). Deliberately NOT in `api`: torch and demucs are about 2GB, which would
# take the API image from 306MB to unshippable on a free tier. In production the
# `modal` backend does the work and this group is not installed.
separation = [
    "demucs==4.1.0",
    "torch",
    "soundfile>=0.12",
    "numpy",
]
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
    "pytest>=8",
    "httpx>=0.28",       # starlette's TestClient transport
    "pyyaml>=6",         # tests parse the compose file
    "pytest-asyncio>=0.24",
]

[tool.setuptools]
# Imported as `packages.core`, not bare `core`: the bare names collide with real
# distributions on PyPI, and having packages/ resolvable under two module names
# at once is ambiguous to any type checker.
packages = [
    "packages",
    "packages.core",
    "packages.audio",
    "packages.lyrics",
    "packages.providers",
]

# ---------------------------------------------------------------------------
# ruff handles both linting and formatting, so there is one tool and one config
# instead of flake8 + isort + black.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# research/ holds the phase 0 scripts. They are kept for reproducibility but are
# not product code, so they are linted more loosely (see per-file-ignores).
extend-exclude = [".venv", "output", "transcripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# research/ holds the phase 0 measurement scripts. They are finished and frozen:
# their value is that the recorded numbers can be reproduced, so they are checked
# for correctness but not modernised for style.
"research/*" = ["E402", "F401", "SIM", "B", "UP031", "E731", "C408"]
"apps/gpu/*" = ["E402"]  # modal requires imports inside the remote functions

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Product code is checked strictly; the phase 0 research scripts are not.
files = ["packages", "apps"]
exclude = "(research|\\.venv)"

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# The service layer is async because the API is. `auto` rather than a marker on
# every test: forgetting the marker makes a coroutine silently never run, and
# pass.
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"
